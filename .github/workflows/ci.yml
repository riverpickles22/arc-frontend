name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The file: dependency on arc-canon-graph needs arc-core as a sibling.
      - uses: actions/checkout@v4
        with:
          path: arc-frontend

      - uses: actions/checkout@v4
        with:
          repository: riverpickles22/arc-core
          path: arc-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: arc-frontend

      - run: npm run lint
        working-directory: arc-frontend

      - run: npm test
        working-directory: arc-frontend

      - run: npm run build
        working-directory: arc-frontend
